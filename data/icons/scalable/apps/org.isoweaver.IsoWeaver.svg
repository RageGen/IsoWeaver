  <path fill="url(#face)" fill-rule="evenodd" d="M64 12a48 48 0 1 1 0 96 48 48 0 0 1 0-96Zm0 38a10 10 0 1 0 0 20 10 10 0 0 0 0-20Z"/>
  <!-- Broad, quiet reflections remain readable at launcher sizes. -->
