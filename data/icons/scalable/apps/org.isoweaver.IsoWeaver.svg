  <defs>
    <linearGradient id="face" x1="16" y1="12" x2="112" y2="108" gradientUnits="userSpaceOnUse">
      <stop stop-color="#99c1f1"/>
      <stop offset=".5" stop-color="#62a0ea"/>
      <stop offset="1" stop-color="#3584e4"/>
    </linearGradient>
  </defs>
